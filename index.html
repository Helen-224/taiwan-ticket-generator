    <aside class="panel" aria-label="車票編輯">
      <p class="eyebrow">MAKE YOUR JOURNEY</p>
      <h1>這班車，要帶你去哪裡？</h1>
      <p class="intro">選好出發與抵達，就準備發車咯。</p>
      <section class="style-picker"><h2>票面風格</h2><div class="style-options" role="group" aria-label="票面風格"><button class="style-option active" type="button" data-style="one" aria-pressed="true"><span class="style-swatch doodle-swatch"></span>島嶼手繪</button><button class="style-option" type="button" data-style="two" aria-pressed="false"><span class="style-swatch fiber-swatch"></span>纖維舊紙</button></div></section>
      <section class="editor-group">
        <h2>出發日期</h2>
        <div class="date-grid"><select id="year" aria-label="年份"></select><select id="month" aria-label="月份"></select><select id="day" aria-label="日期"></select></div>
      </section>
      <section class="editor-group">
        <h2>起點</h2><select id="fromSelect"></select>
        <button class="custom-toggle" id="fromToggle" type="button" aria-expanded="false" aria-controls="fromCustomWrap"><span>＋</span> 自訂起點</button>
        <div class="custom-wrap" id="fromCustomWrap" hidden><input id="fromCustom" type="text" placeholder="例如「台北」" autocomplete="off"></div>
      </section>
      <section class="editor-group">
        <h2>終點</h2><select id="toSelect"></select>
        <button class="custom-toggle" id="toToggle" type="button" aria-expanded="false" aria-controls="toCustomWrap"><span>＋</span> 自訂終點</button>
        <div class="custom-wrap" id="toCustomWrap" hidden><input id="toCustom" type="text" placeholder="例如「台北」" autocomplete="off"></div>
      </section>
      <section class="blessing-editor"><h2>祝福語</h2><input id="blessing" type="text" placeholder="依然勇敢，常保平安" maxlength="12"><p>最多填寫 12 個字；留白時系統會自動配對。</p></section>
      <input id="fromRoman" type="hidden"><input id="toRoman" type="hidden">
      <button id="saveBtn" type="button">儲存我的車票 <span>↓</span></button>
      <p class="hint">將產生高清 PNG 圖片，可儲存或分享給朋友。</p>
